- insert:
    - id: glioblastoma-workbench-main
      name: "@xyb-community/glioblastoma-workbench"
      config:
        root: !!js dshHomePath('glioblastoma-workbench')
# 说明（本仓库 checker 以文件首字符为 `- insert:` 判定，注释一律放条目之后）：
# 1. name 必须写 npm 包名（相对/绝对路径 Node 解析不到）；空 patch 写 `[]`。
# 2. id / config.root 与 dsh/workbench.js 的 PLUGIN_ID、HOST_BASE 同值，别手改。
# 3. config.root 由宿主 dshHomePath 分配用户数据目录（对齐 lymphoma 装机契约）。
